[theme]
# Το βασικό χρώμα για κουμπιά, ενεργά στοιχεία, συνδέσμους
primaryColor = "#0D9488" 

# Το χρώμα φόντου ολόκληρης της σελίδας
backgroundColor = "#0F172A" # Σκούρο μπλε/γκρι (Dark mode)

# Το χρώμα φόντου για sidebars, containers, κάρτες
secondaryBackgroundColor = "#1E293B" 

# Χρώμα βασικού κειμένου
textColor = "#F8FAFC" 

# Επιλογή γραμματοσειράς ('sans serif', 'serif', 'monospace')
font = "monospace"
